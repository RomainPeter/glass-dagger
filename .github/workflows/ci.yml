name: Glass Dagger CI (Light)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Syntax Check
        run: |
          python -m py_compile python/*.py
          
      - name: Benchmark Dry-Run
        run: |
          python python/bench_demo.py --dry-run
          
      - name: Makefile Check
        run: |
          make -n smoke
          make -n bench-demo
          make -n pendulum_bench

