name: Glass Dagger Toolchain (Heavy)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly

jobs:
  full-rebuild-and-bench:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Toolchain (LLVM + Enzyme)
        run: |
          bash scripts/toolchain/build_llvm.sh
          bash scripts/toolchain/build_enzyme.sh
          
      - name: Run Verification
        run: |
          source scripts/toolchain/env.sh
          make verify
          
      - name: Run Full Benchmark
        run: |
          source scripts/toolchain/env.sh
          make bench
          
      - name: Archive Benchmark Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: artifacts/bench.*

